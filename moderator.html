<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team-Quiz · Moderator-Notizen</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 1rem; }
  .box { background: var(--panel); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; line-height: 1.45; }
  h2 { margin: 0 0 .4rem; font-size: 1.1rem; color: var(--warn); }
  .sol { color: var(--ok); font-weight: 700; }
</style>
</head>
<body>
<div class="controls" style="margin-bottom:1rem">
  <button id="prev">◀ Zurück</button><button id="primary" class="primary">Start / Auflösen / Weiter</button><button id="next">Weiter ▶</button>
</div>
<div id="cur" class="box"></div>
<div id="nxt" class="box" style="opacity:.75"></div>
<p class="muted small">Dieses Fenster auf den Laptop-Bildschirm legen, das Hauptfenster auf den Beamer (Bildschirm erweitern, nicht spiegeln).</p>
<script src="common.js"></script>
<script src="questions.js"></script>
<script>
  const ch = new BroadcastChannel("tq-mod");
  const { esc, LETTERS } = TQ;
  function block(it, i, label) {
    if (!it) return `<h2>${label}</h2><span class="muted">–</span>`;
    let h = `<h2>${label}: ${i + 1}. ${esc(it.category || it.title || it.type)}</h2>`;
    if (it.q) h += `<div><b>${esc(it.q)}</b></div>`;
    if (it.a) h += `<div class="sol">Lösung: ${LETTERS[it.correct]} – ${esc(it.a[it.correct])}</div>`;
    if (it.audio) h += `<div class="muted">🎵 ${esc(it.audio)}</div>`;
    if (it.note) h += `<div style="margin-top:.5rem">📝 ${esc(it.note)}</div>`;
    return h;
  }
  ch.onmessage = e => {
    if (!e.data || typeof e.data.idx !== "number") return;
    const i = e.data.idx, items = QUIZ.items;
    document.getElementById("cur").innerHTML = block(items[i], i, "Jetzt") + `<div class="muted small" style="margin-top:.5rem">Phase: ${esc(e.data.phase)}</div>`;
    document.getElementById("nxt").innerHTML = block(items[i + 1], i + 1, "Als Nächstes");
  };
  document.getElementById("prev").onclick = () => ch.postMessage({ cmd: "prev" });
  document.getElementById("next").onclick = () => ch.postMessage({ cmd: "next" });
  document.getElementById("primary").onclick = () => ch.postMessage({ cmd: "primary" });
  ch.postMessage("hello");
</script>
</body>
</html>
