<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team-Quiz · Moderation</title>
<link rel="stylesheet" href="style.css?v=20261112204902">
</head>
<body>
<div class="host">
  <div class="topbar">
    <span class="title" id="title">Team-Quiz</span>
    <span class="muted small" id="net">verbinde…</span>
    <span class="code" id="code" title="Raumcode"></span>
    <span class="muted small" id="pos"></span>
    <button id="bPrev" title="Zurück (←)">◀</button>
    <button id="bNext" title="Weiter (→)">▶</button>
    <button id="bJoin" title="QR-Code / Beitritt anzeigen">📱 Beitritt</button>
    <button id="bLock" title="Neue Teams sperren/erlauben"></button>
    <button id="bRemote" title="Zweites Gerät als Fernbedienung (mit Lösungen &amp; Punkten)">🎛 Fernbedienung</button>
    <button id="bAdmin" title="Teams bearbeiten / Punkte korrigieren">⚙︎</button>
  </div>
  <div class="main">
    <div class="stage" id="stage"></div>
    <div class="side" id="side">
      <div class="score"><h3>Teams verwalten</h3><ol id="scoreList"></ol></div>
      <div id="adminBox" class="hidden">
        <div class="controls">
          <button id="bResetItem">Aktuelle Frage zurücksetzen</button>
          <button id="bResetScores">Alle Punkte zurücksetzen</button>
          <button id="bResetAll" class="bad">Komplett neu (neuer Code)</button>
        </div>
        <p class="muted small">Tastatur: → weiter, ← zurück, Leertaste = Start/Auflösen, N = Notizen, Q = Beitritt.</p>
      </div>
      <div id="notes" class="notes hidden"></div>
    </div>
  </div>
</div>
<script src="vendor/firebase-app-compat.js?v=20261112204902"></script>
<script src="vendor/firebase-database-compat.js?v=20261112204902"></script>
<script src="vendor/qrcode.js?v=20261112204902"></script>
<script src="common.js?v=20261112204902"></script>
<script src="net.js?v=20261112204902"></script>
<script src="questions.js?v=20261112204902"></script>
<script src="host.js?v=20261112204902"></script>
</body>
</html>
